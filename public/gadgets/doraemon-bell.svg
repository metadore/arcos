<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Golden Bell on a Red Collar</title>
  <desc id="d">A glossy golden cat bell hangs from a red collar and swings gently against a sky-blue background.</desc>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#e6f7ff"/>
      <stop offset="60%" stop-color="#b3e5ff"/>
      <stop offset="100%" stop-color="#80d4ff"/>
    </radialGradient>

    <linearGradient id="collarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="40%" stop-color="#e60000"/>
      <stop offset="80%" stop-color="#b30000"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>

    <radialGradient id="bellGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fff5aa"/>
      <stop offset="40%" stop-color="#ffcc00"/>
      <stop offset="75%" stop-color="#e69900"/>
      <stop offset="100%" stop-color="#995c00"/>
    </radialGradient>
    <!-- extra core shadow so the sphere reads as round, light from top-left -->
    <radialGradient id="bellShade" cx="35%" cy="30%" r="85%">
      <stop offset="55%" stop-color="#5c3300" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3d2000" stop-opacity=".55"/>
    </radialGradient>
    <!-- warm light bouncing back up from the floor -->
    <radialGradient id="bounce" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#fff0a0" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#fff0a0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b36b00"/>
      <stop offset="20%" stop-color="#ffdb4d"/>
      <stop offset="50%" stop-color="#fff099"/>
      <stop offset="80%" stop-color="#ffd633"/>
      <stop offset="100%" stop-color="#804d00"/>
    </linearGradient>
    <radialGradient id="holeDark" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a2e00"/>
      <stop offset="50%" stop-color="#261700"/>
      <stop offset="100%" stop-color="#0d0800"/>
    </radialGradient>
    <linearGradient id="metalSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#777777"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#002b4d" flood-opacity=".35"/>
    </filter>
    <filter id="bellGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="blur14" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>

    <clipPath id="sphereClip"><circle cx="400" cy="450" r="180"/></clipPath>
  </defs>

  <style>
    .pv { transform-box: fill-box; transform-origin: center; }

    /* The bell pivots from the collar ring; the collar itself stays put. */
    .bell { transform-origin: 400px 272px; animation: swing 3s ease-in-out infinite alternate; }
    @keyframes swing { 0% { transform: rotate(-6deg); } 100% { transform: rotate(6deg); } }

    /* Collar gives a hair of sway, a beat behind the bell. */
    .collar { transform-origin: 400px 240px; animation: sway 3s ease-in-out infinite alternate; }
    @keyframes sway { 0% { transform: rotate(.6deg); } 100% { transform: rotate(-.6deg); } }

    /* Floor shadow slides with the swing, tightening at the centre. */
    .floor { animation: shadow 3s ease-in-out infinite alternate; }
    @keyframes shadow { 0% { transform: translateX(-26px) scaleX(.95); } 100% { transform: translateX(26px) scaleX(.95); } }

    /* Glint sweeps across the gloss as the bell moves. */
    .glint { animation: glint 3s ease-in-out infinite alternate; }
    @keyframes glint { 0% { opacity: .15; transform: translateX(-10px); } 100% { opacity: .9; transform: translateX(10px); } }

    /* "Ding" ripples are strongest at the ends of the swing. */
    .ding { animation: ding 3s ease-in-out infinite alternate; }
    @keyframes ding { 0%, 100% { opacity: .65; } 50% { opacity: 0; } }

    .sparkle { animation: twinkle 2s ease-in-out infinite alternate; }
    .delay-1 { animation-delay: .6s; }
    .delay-2 { animation-delay: 1.2s; }
    .delay-3 { animation-delay: 1.8s; }
    @keyframes twinkle { 0% { opacity: .3; transform: scale(.8); } 100% { opacity: 1; transform: scale(1.3); } }

    .ring-spin { animation: spin 90s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- ================= BACKGROUND ================= -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <g class="pv ring-spin" opacity=".25" stroke="#0088cc" stroke-width="2" fill="none">
    <circle cx="400" cy="430" r="320" stroke-dasharray="16 12"/>
    <circle cx="400" cy="430" r="290" stroke-dasharray="6 8"/>
  </g>

  <!-- faint clouds to match the sky palette -->
  <g fill="#fff" opacity=".55">
    <g transform="translate(110,120)"><ellipse rx="52" ry="18"/><circle cx="-16" cy="-12" r="18"/><circle cx="12" cy="-20" r="22"/></g>
    <g transform="translate(690,640)"><ellipse rx="46" ry="16"/><circle cx="-14" cy="-10" r="16"/><circle cx="10" cy="-18" r="20"/></g>
    <g transform="translate(700,120) scale(.7)"><ellipse rx="52" ry="18"/><circle cx="-16" cy="-12" r="18"/><circle cx="12" cy="-20" r="22"/></g>
  </g>

  <!-- sparkles -->
  <g filter="url(#bellGlow)">
    <path class="pv sparkle"         d="M160 260Q160 275 175 275Q160 275 160 290Q160 275 145 275Q160 275 160 260Z" fill="#ffcc00"/>
    <path class="pv sparkle delay-1" d="M640 300Q640 318 658 318Q640 318 640 336Q640 318 622 318Q640 318 640 300Z" fill="#fff"/>
    <path class="pv sparkle delay-2" d="M200 580Q200 592 212 592Q200 592 200 604Q200 592 188 592Q200 592 200 580Z" fill="#ffcc00"/>
    <path class="pv sparkle delay-3" d="M610 520Q610 530 620 530Q610 530 610 540Q610 530 600 530Q610 530 610 520Z" fill="#fff"/>
  </g>

  <!-- floor shadow: blurred ellipse (the old drop-shadow filter here doubled the shadow) -->
  <ellipse class="pv floor" cx="400" cy="722" rx="150" ry="18" fill="#003d66" opacity=".3" filter="url(#blur14)"/>

  <!-- ================= COLLAR (hangs still) ================= -->
  <g class="collar" filter="url(#dropShadow)">
    <path d="M140 160 Q400 230 660 160 L645 240 Q400 305 155 240 Z" fill="url(#collarGrad)"/>
    <!-- top sheen -->
    <path d="M142 164 Q400 234 658 164 L656 186 Q400 255 144 186 Z" fill="#fff" opacity=".12"/>
    <!-- stitching: real dashes, not just a line -->
    <path d="M150 176 Q400 243 650 176" fill="none" stroke="#ffb3b3" stroke-width="2.5" stroke-dasharray="10 7" stroke-linecap="round" opacity=".75"/>
    <path d="M162 229 Q400 293 638 229" fill="none" stroke="#660000" stroke-width="2.5" stroke-dasharray="10 7" stroke-linecap="round" opacity=".55"/>
    <rect x="135" y="155" width="16" height="88" rx="4" fill="url(#metalSilver)" transform="rotate(15 143 199)"/>
    <rect x="649" y="155" width="16" height="88" rx="4" fill="url(#metalSilver)" transform="rotate(-15 657 199)"/>
    <!-- clasp rivets -->
    <g fill="#555"><circle cx="146" cy="178" r="2"/><circle cx="141" cy="222" r="2"/><circle cx="654" cy="178" r="2"/><circle cx="659" cy="222" r="2"/></g>
  </g>

  <!-- ================= SWINGING BELL ================= -->
  <g class="bell" filter="url(#dropShadow)">

    <!-- sound ripples -->
    <g class="ding" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
      <path d="M170 400 Q150 450 170 500"/><path d="M140 380 Q112 450 140 520" opacity=".6"/>
      <path d="M630 400 Q650 450 630 500"/><path d="M660 380 Q688 450 660 520" opacity=".6"/>
    </g>

    <!-- sphere -->
    <circle cx="400" cy="450" r="180" fill="url(#bellGold)"/>
    <circle cx="400" cy="450" r="180" fill="url(#bellShade)"/>
    <circle cx="400" cy="450" r="180" fill="url(#bounce)"/>
    <circle cx="400" cy="450" r="180" fill="none" stroke="#804d00" stroke-width="4" opacity=".7"/>

    <!-- seam: smile-shaped, since we look at the bell from slightly above -->
    <g clip-path="url(#sphereClip)">
      <path d="M205 392 Q400 462 595 392 L595 422 Q400 492 205 422 Z" fill="url(#rimGrad)"/>
      <path d="M205 392 Q400 462 595 392" fill="none" stroke="#995c00" stroke-width="1.5"/>
      <path d="M205 422 Q400 492 595 422" fill="none" stroke="#995c00" stroke-width="1.5"/>
      <!-- dark groove between the two rims -->
      <path d="M205 407 Q400 477 595 407" fill="none" stroke="#4d2e00" stroke-width="5"/>
      <!-- lower rim catches a little shade -->
      <path d="M205 422 Q400 492 595 422 L595 428 Q400 498 205 428 Z" fill="#7a4700" opacity=".35"/>
    </g>

    <!-- sound hole (a ring of metal around a dark opening) -->
    <circle cx="400" cy="518" r="29" fill="#ffe27a" stroke="#995c00" stroke-width="2.5"/>
    <circle cx="400" cy="518" r="24" fill="url(#holeDark)"/>
    <circle cx="400" cy="518" r="19" fill="#1a0f00"/>
    <path d="M385 510 Q395 500 408 506" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".25"/>

    <!-- slit runs down to the sphere's bottom edge and stops exactly there -->
    <path d="M392 546 L392 622 Q400 630 408 622 L408 546 Z" fill="url(#holeDark)" stroke="#663d00" stroke-width="2" stroke-linejoin="round"/>
    <path d="M395 548 L395 618 Q400 625 405 618 L405 548 Z" fill="#1a0f00"/>

    <!-- gloss -->
    <g stroke-linecap="round">
      <path d="M270 330 A140 140 0 0 1 360 285" fill="none" stroke="#fff" stroke-width="12" opacity=".75" filter="url(#bellGlow)"/>
      <path d="M270 330 A140 140 0 0 1 360 285" fill="none" stroke="#fff" stroke-width="5" opacity=".9"/>
      <ellipse cx="260" cy="360" rx="9" ry="18" transform="rotate(-30 260 360)" fill="#fff" opacity=".6"/>
      <path d="M540 560 A150 150 0 0 1 470 612" fill="none" stroke="#ffeb99" stroke-width="6" opacity=".45"/>
      <!-- moving glint -->
      <g class="glint"><path d="M330 300 Q380 275 430 285" fill="none" stroke="#fff" stroke-width="7" opacity=".7"/></g>
    </g>

    <!-- attachment ring sits in front of the bell's crown -->
    <ellipse cx="400" cy="275" rx="35" ry="18" fill="#663d00"/>
    <ellipse cx="400" cy="275" rx="27" ry="12" fill="url(#metalSilver)"/>
    <ellipse cx="400" cy="275" rx="18" ry="7"  fill="#2a1a00"/>
    <ellipse cx="392" cy="271" rx="9" ry="2.5" fill="#fff" opacity=".6"/>
  </g>
</svg>
