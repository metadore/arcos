<g fill="#fff">
<circle cx="0" cy="318" r="44"/><circle cx="90" cy="306" r="56"/><circle cx="200" cy="316" r="46"/><circle cx="310" cy="304" r="58"/><circle cx="430" cy="316" r="48"/><circle cx="540" cy="306" r="54"/><circle cx="650" cy="316" r="46"/><circle cx="760" cy="304" r="58"/><circle cx="880" cy="316" r="48"/><circle cx="990" cy="306" r="54"/><circle cx="1100" cy="316" r="48"/><circle cx="1200" cy="306" r="56"/>
