<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="100%"
  height="100%"
  viewBox="0 0 600 700"
  role="img"
  aria-labelledby="title description"
  preserveAspectRatio="xMidYMid meet"
>
  <title id="title">Animated Doraemon</title>
  <desc id="description">
    A cheerful blue robotic cat with a red nose, golden bell,
    white belly and animated waving arms.
  </desc>

  <defs>

    <!-- BACKGROUND -->
    <radialGradient id="background" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e6f7ff"/>
      <stop offset="100%" stop-color="#b9e7fa"/>
    </radialGradient>

    <!-- BLUE HEAD -->
    <radialGradient id="headBlue" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#39c5ff"/>
      <stop offset="45%" stop-color="#009ee8"/>
      <stop offset="100%" stop-color="#005b9c"/>
    </radialGradient>

    <!-- BLUE BODY -->
    <radialGradient id="bodyBlue" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#35c5ff"/>
      <stop offset="55%" stop-color="#008ed0"/>
      <stop offset="100%" stop-color="#00538c"/>
    </radialGradient>

    <!-- RED -->
    <radialGradient id="redGradient" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#ff7777"/>
      <stop offset="55%" stop-color="#f21c32"/>
      <stop offset="100%" stop-color="#a90016"/>
    </radialGradient>

    <!-- GOLD BELL -->
    <radialGradient id="goldGradient" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#fff9a6"/>
      <stop offset="35%" stop-color="#ffe45c"/>
      <stop offset="75%" stop-color="#e9a900"/>
      <stop offset="100%" stop-color="#9c6100"/>
    </radialGradient>

    <!-- WHITE BODY -->
    <linearGradient id="whiteGradient" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf5fa"/>
    </linearGradient>

    <!-- POCKET -->
    <linearGradient id="pocketGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf0f5"/>
    </linearGradient>

    <!-- CHARACTER SHADOW -->
    <filter id="characterShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="9"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- BELL SHADOW -->
    <filter id="bellShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow
        dx="1"
        dy="3"
        stdDeviation="3"
        flood-color="#000000"
        flood-opacity="0.3"
      />
    </filter>

    <!-- SOFT HIGHLIGHT -->
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- GROUND SHADOW -->
    <filter id="groundBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

  </defs>

  <!-- BACKGROUND -->
  <rect
    width="600"
    height="700"
    rx="28"
    fill="url(#background)"
  />

  <!-- BACKGROUND DECORATION -->
  <g opacity="0.3" fill="#ffffff">
    <circle cx="90" cy="120" r="5"/>
    <circle cx="500" cy="180" r="7"/>
    <circle cx="85" cy="440" r="4"/>
    <circle cx="520" cy="480" r="5"/>
    <circle cx="450" cy="90" r="3"/>
    <circle cx="140" cy="550" r="6"/>
  </g>

  <!-- GROUND SHADOW -->
  <ellipse
    cx="300"
    cy="642"
    rx="155"
    ry="15"
    fill="#003957"
    opacity="0.2"
    filter="url(#groundBlur)"
  >
    <animate
      attributeName="rx"
      values="155;135;155"
      dur="3s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values="0.2;0.1;0.2"
      dur="3s"
      repeatCount="indefinite"
    />
  </ellipse>

  <!-- MAIN CHARACTER -->
  <g id="doraemon" filter="url(#characterShadow)">

    <!-- FLOATING ANIMATION -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -9; 0 0"
      dur="3s"
      repeatCount="indefinite"
    />

    <!-- LEFT ARM -->
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 180 365; 12 180 365; -7 180 365; 0 180 365"
        dur="2.2s"
        repeatCount="indefinite"
      />

      <path
        d="M190 370
           C150 375 118 345 110 320
           C105 301 125 292 145 305
           L195 345 Z"
        fill="url(#bodyBlue)"
        stroke="#001c30"
        stroke-width="4.5"
        stroke-linejoin="round"
      />

      <circle
        cx="112"
        cy="307"
        r="31"
        fill="url(#whiteGradient)"
        stroke="#001c30"
        stroke-width="4.5"
      />

      <ellipse
        cx="103"
        cy="297"
        rx="13"
        ry="9"
        fill="#ffffff"
        opacity="0.7"
      />
    </g>

    <!-- RIGHT ARM -->
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 420 365; -5 420 365; 0 420 365"
        dur="3s"
        repeatCount="indefinite"
      />

      <path
        d="M410 370
           C450 375 482 345 490 320
           C495 301 475 292 455 305
           L405 345 Z"
        fill="url(#bodyBlue)"
        stroke="#001c30"
        stroke-width="4.5"
        stroke-linejoin="round"
      />

      <circle
        cx="488"
        cy="307"
        r="31"
        fill="url(#whiteGradient)"
        stroke="#001c30"
        stroke-width="4.5"
      />

      <ellipse
        cx="479"
        cy="297"
        rx="13"
        ry="9"
        fill="#ffffff"
        opacity="0.7"
      />
    </g>

    <!-- FEET -->
    <g stroke="#001c30" stroke-width="4.5">

      <ellipse
        cx="215"
        cy="620"
        rx="63"
        ry="27"
        fill="url(#whiteGradient)"
      />

      <ellipse
        cx="385"
        cy="620"
        rx="63"
        ry="27"
        fill="url(#whiteGradient)"
      />

    </g>

    <!-- BODY -->
    <path
      d="M180 340
         C155 420 155 560 210 590
         C240 608 360 608 390 590
         C445 560 445 420 420 340 Z"
      fill="url(#bodyBlue)"
      stroke="#001c30"
      stroke-width="4.5"
      stroke-linejoin="round"
    />

    <!-- WHITE BELLY -->
    <path
      d="M195 347
         C185 430 195 555 240 570
         C270 582 330 582 360 570
         C405 555 415 430 405 347 Z"
      fill="url(#whiteGradient)"
      stroke="#001c30"
      stroke-width="4.5"
    />

    <!-- BELLY POCKET -->
    <path
      d="M225 425
         L375 425
         C375 490 347 522 300 522
         C253 522 225 490 225 425 Z"
      fill="url(#pocketGradient)"
      stroke="#001c30"
      stroke-width="4"
      stroke-linejoin="round"
    />

    <!-- POCKET HIGHLIGHT -->
    <path
      d="M235 433 Q300 439 365 433"
      fill="none"
      stroke="#ffffff"
      stroke-width="4"
      opacity="0.9"
      stroke-linecap="round"
    />

    <!-- NECK COLLAR -->
    <rect
      x="170"
      y="326"
      width="260"
      height="27"
      rx="13"
      fill="url(#redGradient)"
      stroke="#001c30"
      stroke-width="4.5"
    />

    <!-- HEAD -->
    <g id="head">

      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 300 230; 1.5 300 230; -1.5 300 230; 0 300 230"
        dur="5s"
        repeatCount="indefinite"
      />

      <!-- OUTER HEAD -->
      <ellipse
        cx="300"
        cy="225"
        rx="200"
        ry="175"
        fill="url(#headBlue)"
        stroke="#001c30"
        stroke-width="4.5"
      />

      <!-- HEAD HIGHLIGHT -->
      <ellipse
        cx="235"
        cy="105"
        rx="95"
        ry="30"
        fill="#ffffff"
        opacity="0.1"
        transform="rotate(-15 235 105)"
      />

      <!-- WHITE FACE -->
      <path
        d="M140 245
           C130 150 190 112 300 112
           C410 112 470 150 460 245
           C450 320 390 345 300 345
           C210 345 150 320 140 245 Z"
        fill="url(#whiteGradient)"
        stroke="#001c30"
        stroke-width="4.5"
      />

      <!-- MOUTH -->
      <path
        d="M175 220
           Q300 280 425 220
           C425 290 390 327 300 330
           C210 327 175 290 175 220 Z"
        fill="#c90020"
        stroke="#001c30"
        stroke-width="4.5"
        stroke-linejoin="round"
      />

      <!-- TONGUE -->
      <path
        d="M218 286
           Q260 260 300 276
           Q340 260 382 286
           Q350 318 300 318
           Q250 318 218 286 Z"
        fill="#ff737e"
        stroke="#9c1023"
        stroke-width="2.5"
      />

      <!-- SMILE CORNERS -->
      <path
        d="M174 221 Q180 216 190 226"
        fill="none"
        stroke="#001c30"
        stroke-width="4"
        stroke-linecap="round"
      />

      <path
        d="M426 221 Q420 216 410 226"
        fill="none"
        stroke="#001c30"
        stroke-width="4"
        stroke-linecap="round"
      />

      <!-- NOSE TO MOUTH LINE -->
      <path
        d="M284 177 L284 276"
        fill="none"
        stroke="#001c30"
        stroke-width="4"
        stroke-linecap="round"
      />

      <!-- EYES -->
      <g id="eyes">

        <!-- BLINKING -->
        <animateTransform
          attributeName="transform"
          type="scale"
          values="1 1; 1 1; 1 0.08; 1 1; 1 1"
          keyTimes="0; 0.43; 0.47; 0.51; 1"
          dur="4.5s"
          repeatCount="indefinite"
          additive="replace"
          origin="284 120"
        />

        <!-- LEFT EYE -->
        <ellipse
          cx="260"
          cy="120"
          rx="24"
          ry="34"
          fill="#ffffff"
          stroke="#001c30"
          stroke-width="4"
        />

        <!-- RIGHT EYE -->
        <ellipse
          cx="308"
          cy="120"
          rx="24"
          ry="34"
          fill="#ffffff"
          stroke="#001c30"
          stroke-width="4"
        />

        <!-- PUPILS -->
        <g>
          <animateTransform
            attributeName="transform"
            type="translate"
            values="0 0; 3 0; -3 0; 0 0"
            dur="5s"
            repeatCount="indefinite"
          />

          <ellipse
            cx="270"
            cy="127"
            rx="8"
            ry="12"
            fill="#080808"
          />

          <ellipse
            cx="298"
            cy="127"
            rx="8"
            ry="12"
            fill="#080808"
          />

          <circle cx="267" cy="122" r="3" fill="#ffffff"/>
          <circle cx="295" cy="122" r="3" fill="#ffffff"/>

        </g>
      </g>

      <!-- RED NOSE -->
      <g>
        <circle
          cx="284"
          cy="160"
          r="18"
          fill="url(#redGradient)"
          stroke="#001c30"
          stroke-width="4"
        />

        <ellipse
          cx="278"
          cy="153"
          rx="6"
          ry="5"
          fill="#ffffff"
          opacity="0.8"
        >
          <animate
            attributeName="opacity"
            values="0.8;0.3;0.8"
            dur="2s"
            repeatCount="indefinite"
          />
        </ellipse>
      </g>

      <!-- WHISKERS -->
      <g
        stroke="#001c30"
        stroke-width="3.5"
        stroke-linecap="round"
        fill="none"
      >

        <animateTransform
          attributeName="transform"
          type="rotate"
          values="0 300 210; 0.8 300 210; -0.8 300 210; 0 300 210"
          dur="3s"
          repeatCount="indefinite"
        />

        <!-- LEFT -->
        <path d="M150 175 L245 190"/>
        <path d="M140 210 L240 212"/>
        <path d="M145 245 L245 232"/>

        <!-- RIGHT -->
        <path d="M418 190 L518 175"/>
        <path d="M423 212 L528 210"/>
        <path d="M418 232 L518 245"/>

      </g>

    </g>

    <!-- GOLDEN BELL -->
    <g filter="url(#bellShadow)">

      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 300 350; 5 300 350; -5 300 350; 0 300 350"
        dur="2.5s"
        repeatCount="indefinite"
      />

      <!-- BELL -->
      <circle
        cx="300"
        cy="365"
        r="26"
        fill="url(#goldGradient)"
        stroke="#001c30"
        stroke-width="4"
      />

      <!-- BELL HIGHLIGHT -->
      <ellipse
        cx="290"
        cy="354"
        rx="8"
        ry="5"
        fill="#ffffff"
        opacity="0.7"
      />

      <!-- BELL LINES -->
      <path
        d="M276 358 H324 M275 364 H325"
        stroke="#8a5600"
        stroke-width="3"
        stroke-linecap="round"
      />

      <!-- BELL OPENING -->
      <circle
        cx="300"
        cy="375"
        r="5"
        fill="#442600"
      />

      <path
        d="M300 380 V389"
        stroke="#442600"
        stroke-width="3.5"
        stroke-linecap="round"
      />

    </g>

  </g>

  <!-- OPTIONAL FOOTER GLOW -->
  <ellipse
    cx="300"
    cy="650"
    rx="100"
    ry="4"
    fill="#ffffff"
    opacity="0.4"
    filter="url(#softGlow)"
  />

</svg>
