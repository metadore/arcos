<use href="#st" fill="#fff" transform="translate(880 140) scale(.8)"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></use></g>
<text x="600" y="168" text-anchor="middle" font-family="'Trebuchet MS',Verdana,sans-serif" font-size="108" font-weight="900" letter-spacing="20" fill="#fff" stroke="#0369A1" stroke-width="12" stroke-linejoin="round" paint-order="stroke">ARCOS</text>
<rect x="400" y="190" width="400" height="44" rx="22" fill="#0369A1" opacity=".88"/>
